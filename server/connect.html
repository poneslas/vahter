<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вахтёр · подключение к Hermes</title>
<style>
body{font:17px/1.45 system-ui,sans-serif;margin:0;padding:28px 22px;background:#f5f5f0;color:#1a1f36}
h1{font-size:24px;margin:0 0 10px}p{margin:8px 0;color:#555}
a.b{display:block;margin:22px 0 10px;padding:16px;border-radius:14px;background:#1a1f36;color:#fff;text-align:center;text-decoration:none;font-weight:600}
code{font-size:13px;word-break:break-all;color:#333}
</style>
<h1>Подключить Hermes</h1>
<p id="s">Открываю приложение «Вахтёр»…</p>
<a class="b" id="go" href="#">Открыть в Вахтёре</a>
<p>Нет приложения? Поставьте «Вахтёр» и откройте эту ссылку снова. Или в приложении: Настройки → Мозги → Hermes → «Вставить приглашение» — скопировав ссылку ниже.</p>
<p><code id="l"></code></p>
<script>
var t=location.hash.replace(/^#/,'');
var u='vahter://connect?url='+encodeURIComponent(location.origin)+'&token='+encodeURIComponent(t);
if(!t){document.getElementById('s').textContent='В ссылке нет ключа — попросите новое приглашение.';}
else{document.getElementById('go').href=u;document.getElementById('l').textContent=u;setTimeout(function(){location.href=u},300);}
</script>
